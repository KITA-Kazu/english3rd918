let stage=1,score=0,correct=0,total=0,correctStreak=0,wrongStreak=0,timeLeft=90,timerId=null,current=null,accepting=true,mode="normal",decks={},reviewList=[];
const $=id=>document.getElementById(id);
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function loadReview(){try{return JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){return[]}}
function saveReview(){localStorage.setItem(KEY,JSON.stringify(reviewList))}
function updateReviewCount(){$("reviewCount").textContent=loadReview().length}
function resetDecks(){decks={1:shuffle(QUESTIONS[1]),2:shuffle(QUESTIONS[2]),3:shuffle(QUESTIONS[3]),4:shuffle(QUESTIONS[4])}}
function prepareQuestion(q){const items=q.choices.map((text,i)=>({text,correct:i===q.answer}));const mixed=shuffle(items);return {...q,choices:mixed.map(x=>x.text),answer:mixed.findIndex(x=>x.correct),translation:q.translation || (q.stage != null && q.index != null ? TRANSLATIONS[q.stage][q.index] : "")}}
function renderQuestion(){accepting=true;hintUsed=false;$("hintBtn").disabled=false;$("feedback").textContent="";$("feedback").className="feedback";$("question").textContent=current.q;
$("translation").textContent=current.translation||"";
$("translation").classList.toggle("hidden",mode!=="review");
$("hintBtn").classList.toggle("hidden",mode==="review");
const box=$("choices");box.innerHTML="";current.choices.forEach((c,i)=>{const b=document.createElement("button");b.className="choice";b.textContent=String.fromCharCode(65+i)+". "+c;b.onclick=()=>answer(i,b);box.appendChild(b)});$("badge").textContent=mode==="review"?"REVIEW":"STAGE "+stage;$("badge").className=mode==="review"?"badge s3":"badge s"+stage}
function nextNormalQuestion(){if(!decks[stage].length)decks[stage]=shuffle(QUESTIONS[stage]);current=prepareQuestion(decks[stage].pop());renderQuestion()}
function nextReviewQuestion(){if(!reviewList.length){finishReview();return}current=prepareQuestion(reviewList[Math.floor(Math.random()*reviewList.length)]);renderQuestion()}
function updateStats(){$("score").textContent=score;$("correct").textContent=correct;$("total").textContent=total;$("streakC").textContent=correctStreak;$("streakW").textContent=wrongStreak}
function addWrong(q){const saved=loadReview();if(!saved.some(x=>x.id===q.id))saved.push(q);reviewList=saved;saveReview();updateReviewCount()}
function removeReview(q){reviewList=reviewList.filter(x=>x.id!==q.id);saveReview();updateReviewCount()}
function useHint(){
if(mode==="review"||hintUsed||!accepting)return;
hintUsed=true;
$("hintBtn").disabled=true;
$("translation").textContent=current.translation||"";
$("translation").classList.remove("hidden");
$("feedback").textContent="ヒントを使用しました。和訳を表示しています。正解時の得点は半分になります。";
$("feedback").className="feedback";
}
function answer(i,btn){if(!accepting)return;accepting=false;const buttons=[...$("choices").children];buttons.forEach(b=>b.disabled=true);const ok=i===current.answer;if(ok){btn.classList.add("correct");$("feedback").textContent="Correct!";$("feedback").classList.add("correct-text")}else{btn.classList.add("wrong");buttons[current.answer].classList.add("correct");$("feedback").textContent="Answer: "+current.choices[current.answer];$("feedback").classList.add("wrong-text")}
if(mode==="review"){if(ok)removeReview(current);setTimeout(nextReviewQuestion,450);return}
total++;if(ok){correct++;score+=Math.floor(POINTS[stage]*(hintUsed?0.5:1));correctStreak++;wrongStreak=0;if(correctStreak>=3&&stage<4){correctStreak=0;wrongStreak=0;setTimeout(()=>stageChange(1),250);return}}else{wrongStreak++;correctStreak=0;addWrong(current);if(wrongStreak>=2&&stage>1){correctStreak=0;wrongStreak=0;setTimeout(()=>stageChange(-1),250);return}}updateStats();setTimeout(nextNormalQuestion,400)}
function showOverlay(title,cls,done){$("overlayTitle").textContent=title;$("overlayBox").className="overlay-box "+cls;$("overlay").classList.remove("hidden");setTimeout(()=>{$("overlay").classList.add("hidden");done()},900)}
function stageChange(delta){stage=Math.max(1,Math.min(4,stage+delta));updateStats();showOverlay(delta>0?"STAGE UP!":"STAGE DOWN...",delta>0?"up":"down",()=>{resetDecks();nextNormalQuestion()})}
function updateProgress(){$("progressBar").style.width=timeLeft/90*100+"%"}
function startGame(){clearInterval(timerId);mode="normal";stage=1;score=0;correct=0;total=0;correctStreak=0;wrongStreak=0;timeLeft=90;resetDecks();$("home").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");$("reviewInfo").classList.add("hidden");$("timer").textContent=timeLeft;$("timer").classList.remove("warning");updateStats();updateProgress();nextNormalQuestion();timerId=setInterval(()=>{timeLeft--;$("timer").textContent=timeLeft;updateProgress();if(timeLeft<=10)$("timer").classList.add("warning");if(timeLeft<=0)endGame()},1000)}
function endGame(){clearInterval(timerId);accepting=false;$("game").classList.add("hidden");$("result").classList.remove("hidden");$("finalScore").textContent=score+" pt";$("finalStage").textContent="STAGE "+stage;$("accuracy").textContent=total?Math.round(correct/total*100)+"%":"0%";$("finalTotal").textContent=total}
function startReview(){reviewList=loadReview();if(!reviewList.length){alert("復習する問題はありません。");return}mode="review";$("home").classList.add("hidden");$("result").classList.add("hidden");$("game").classList.remove("hidden");$("reviewInfo").classList.remove("hidden");$("timer").textContent="∞";$("timer").classList.remove("warning");$("badge").textContent="REVIEW";$("badge").className="badge s3";$("score").textContent="—";$("correct").textContent="—";$("total").textContent=reviewList.length;$("streakC").textContent="—";$("streakW").textContent="—";$("progressBar").style.width="100%";nextReviewQuestion()}
function finishReview(){$("game").classList.add("hidden");$("home").classList.remove("hidden");updateReviewCount();alert("復習完了！間違えた問題をすべて正解しました。")}
function goHome(){clearInterval(timerId);$("result").classList.add("hidden");$("game").classList.add("hidden");$("home").classList.remove("hidden");updateReviewCount()}
$("hintBtn").onclick=useHint;
$("startBtn").onclick=startGame;$("reviewBtn").onclick=startReview;$("againBtn").onclick=startGame;$("homeBtn").onclick=goHome;
for(let s=1;s<=4;s++)QUESTIONS[s].forEach((q,i)=>{q.id="s"+s+"-"+i;q.stage=s;q.index=i;q.translation=TRANSLATIONS[s][i];});
updateReviewCount();
</script>
